<!doctype html>
<html lang="en">
<head>

    <h2>Tenancy</h2>

  </section>
  <section class="card" id="actions-card" hidden>
    <h2>Actions</h2>
    <div id="actions"></div>

<script src="/bell.js"></script>
<script src="/chat-badge.js"></script>
<script src="/tenancy.js"></script>
