<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications — Kiraya Register</title>
<meta name="description" content="Your in-app notifications: bills due, overdue bills, link requests and tenancy updates.">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">V</span><h1>Kiraya Register</h1></div>
  <div class="centre-pill">Your rent, on record</div>
  <a class="bell-link" id="bell" href="/notifications" hidden aria-label="Notifications">🔔<span class="badge" id="bell-badge" hidden></span></a>
  <span class="lock-pill">🔒 Private</span>
</header>
<main>
  <p><a class="back-link" href="/">← Back to home</a></p>
  <section class="card">
    <h2>Notifications</h2>
    <p class="muted">In-app only — no reminders when the app is closed, no real WhatsApp messages, no SMS, no push. Open the app and this list tells you what is due.</p>
    <p><button class="small" id="read-all">Mark all read</button> <span class="tag" id="notif-msg" role="status"></span></p>
    <div id="list"></div>
  </section>
</main>
<script src="/bell.js"></script>
<script src="/notifications.js"></script>
</body>
</html>
